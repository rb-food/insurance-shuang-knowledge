<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保险服务通话知识库</title>
<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #151b23;
  --bg-tertiary: #1c2330;
  --bg-hover: #212830;
  --bg-card: #1a212b;
  --bg-card-hover: #1f2632;
  --bg-active: rgba(88,166,255,0.10);
  --bg-active-solid: #1b283d;
  --border-color: #2c333b;
  --border-light: #3d444d;
  --text-primary: #f0f6fc;
  --text-secondary: #9fa8b4;
  --text-muted: #6e7c8a;
  --accent-blue: #58a6ff;
  --accent-blue-dim: #1f6feb;
  --accent-green: #3fb950;
  --accent-orange: #d29922;
  --accent-purple: #bc8cff;
  --accent-red: #f85149;
  --accent-teal: #39d0d8;
  --tag-flow: #58a6ff;
  --tag-knowledge: #bc8cff;
  --tag-qa: #3fb950;
  --tag-scene: #d29922;
  --tag-policy: #39d0d8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.45);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.55);
  --radius: 10px;
  --radius-lg: 14px;
  --sidebar-w: 300px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 15px;
  line-height: 1.7;
  min-height: 100vh;
}

/* ========== Scrollbar ========== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ========== Top Header ========== */
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 60px; display: flex; align-items: center; gap: 18px;
  padding: 0 22px 0 24px;
  background: rgba(21,27,35,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-color);
  box-shadow: 0 2px 16px rgba(0,0,0,0.35);
}
.header-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.header-logo .icon {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent-blue-dim), var(--accent-purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; box-shadow: 0 2px 8px rgba(88,166,255,0.25);
}
.header-logo .title { font-size: 18px; font-weight: 800; letter-spacing: 0.3px; }
.header-logo .title .sub { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-left: 6px; }

/* Search */
.search-wrap { flex: 1; max-width: 520px; position: relative; margin-left: auto; }
.search-wrap input {
  width: 100%; height: 38px; border-radius: 10px;
  background: var(--bg-tertiary); border: 1px solid var(--border-color);
  color: var(--text-primary); font-size: 14px; padding: 0 38px 0 40px;
  transition: var(--transition);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.15);
}
.search-wrap input:focus {
  outline: none; border-color: var(--accent-blue);
  box-shadow: 0 0 0 3px rgba(88,166,255,0.12), inset 0 1px 2px rgba(0,0,0,0.15);
  background: var(--bg-card);
}
.search-wrap input::placeholder { color: var(--text-muted); }
.search-wrap .search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); font-size: 14px; pointer-events: none;
}
.search-wrap .clear-btn {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); cursor: pointer; font-size: 14px;
  display: none; transition: var(--transition);
}
.search-wrap .clear-btn:hover { color: var(--text-primary); }

/* Header actions */
.header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.header-btn {
  height: 38px; padding: 0 14px; border-radius: 10px;
  background: var(--bg-card); border: 1px solid var(--border-color);
  color: var(--text-secondary); cursor: pointer; font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 6px; transition: var(--transition);
  box-shadow: var(--shadow-sm);
}
.header-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: var(--border-light); }
.header-btn.active {
  background: rgba(210,153,34,0.12); border-color: rgba(210,153,34,0.4); color: var(--accent-orange);
}
.header-btn .count { font-size: 11px; background: var(--accent-blue-dim); color: #fff; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
.header-btn.active .count { background: var(--accent-orange); }
.sidebar-toggle { display: none; }

/* ========== Layout ========== */
.layout { display: flex; padding-top: 60px; min-height: 100vh; }

/* Sidebar */
.sidebar {
  position: fixed; top: 60px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: var(--bg-secondary); border-right: 1px solid var(--border-color);
  overflow-y: auto; z-index: 50; transition: var(--transition);
  display: flex; flex-direction: column;
}

/* Sidebar Tree */
.sidebar-tree {
  flex: 1; overflow-y: auto; padding: 12px 14px 40px;
}
.tree-group {
  margin-bottom: 16px;
}
.tree-group-header {
  padding: 8px 12px 10px;
  font-size: 10px; font-weight: 800;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
  display: flex; align-items: center; gap: 8px;
}
.tree-group-header::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--border-color), transparent);
}
.section-node {
  margin-bottom: 10px;
  border-radius: var(--radius-lg);
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-left: 3px solid transparent;
  overflow: hidden;
  transition: var(--transition);
  box-shadow: var(--shadow-sm);
}
.section-node:hover {
  border-color: var(--border-light);
  background: var(--bg-card-hover);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.section-node.active {
  border-color: var(--border-light);
  background: var(--bg-active-solid);
  box-shadow: 0 0 0 1px rgba(88,166,255,0.15), var(--shadow-md);
}
.section-node.expanded {
  border-color: var(--border-light);
  background: var(--bg-card-hover);
}
.section-node.active.expanded {
  border-color: var(--border-light);
  background: var(--bg-active-solid);
}

/* Per-section accent indicator on left border */
.section-node[data-tag-color="tag-flow"] { --node-accent: var(--tag-flow); }
.section-node[data-tag-color="tag-knowledge"] { --node-accent: var(--tag-knowledge); }
.section-node[data-tag-color="tag-qa"] { --node-accent: var(--tag-qa); }
.section-node[data-tag-color="tag-scene"] { --node-accent: var(--tag-scene); }
.section-node[data-tag-color="tag-policy"] { --node-accent: var(--tag-policy); }

.section-node.active {
  border-left: 3px solid var(--node-accent);
}
.section-node.expanded {
  border-left: 3px solid rgba(255,255,255,0.08);
}
.section-node.active.expanded {
  border-left: 3px solid var(--node-accent);
}

.section-header {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px;
  cursor: pointer;
  transition: var(--transition);
  font-size: 15px; font-weight: 700; color: var(--text-primary);
  user-select: none;
}
.section-node.empty > .section-header { color: var(--text-muted); opacity: 0.75; }
.section-header .section-icon { font-size: 18px; flex-shrink: 0; }
.section-header .section-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.section-header .section-count {
  font-size: 12px; font-weight: 700; color: var(--text-secondary); flex-shrink: 0;
  background: var(--bg-tertiary); padding: 3px 10px; border-radius: 20px;
  border: 1px solid var(--border-color);
}
.section-node.active > .section-header .section-count { color: var(--accent-blue); border-color: rgba(88,166,255,0.3); background: rgba(88,166,255,0.1); }
.section-node.empty > .section-header .section-count { background: var(--bg-hover); color: var(--text-muted); border-color: transparent; }
.section-children {
  display: none; overflow: hidden;
  background: rgba(0,0,0,0.10);
  border-top: 1px solid var(--border-color);
}
.section-node.expanded > .section-children { display: block; }

/* Child items in sidebar tree */
.nav-items { padding: 6px 0; }
.nav-item {
  display: block; font-size: 13px; color: var(--text-secondary);
  transition: var(--transition); position: relative;
}
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
.nav-item.active { background: var(--bg-active); }
.nav-item.active > .nav-item-row { color: var(--accent-blue); }
.nav-item-row {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 16px 9px 52px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: var(--transition);
}
.nav-item.active > .nav-item-row { border-left-color: var(--accent-blue); }
.nav-item-header {
  display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;
}
.nav-item .tag-dot {
  width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
}
.nav-item-title {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-weight: 500;
}
.nav-item .fav-star {
  font-size: 12px; color: var(--text-muted);
  opacity: 0; transition: var(--transition); flex-shrink: 0;
}
.nav-item.favorited .fav-star { opacity: 1; color: var(--accent-orange); }
.nav-item:hover .fav-star { opacity: 0.6; }
.nav-item.favorited:hover .fav-star { opacity: 1; }

/* Tag colors */
.tag-flow { background: var(--tag-flow); }
.tag-knowledge { background: var(--tag-knowledge); }
.tag-qa { background: var(--tag-qa); }
.tag-scene { background: var(--tag-scene); }
.tag-policy { background: var(--tag-policy); }

/* ========== Main Content ========== */
.main {
  flex: 1; margin-left: var(--sidebar-w);
  padding: 28px 36px 100px; max-width: 1100px;
}

/* Page container */
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.35s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Section Title */
.section-title-block {
  margin-bottom: 28px; padding: 24px 26px;
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.section-title-block h2 {
  font-size: 24px; font-weight: 800; margin-bottom: 8px;
  display: flex; align-items: center; gap: 12px;
}
.section-title-block .desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
.section-title-block .badge {
  display: inline-block; padding: 4px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 700; margin-left: 10px;
}

/* Flow Steps — clean timeline */
.flow-container { position: relative; padding-left: 6px; }
.flow-step {
  display: flex; gap: 18px; margin-bottom: 0; position: relative;
}
.flow-step .step-marker {
  flex-shrink: 0; width: 36px; display: flex; flex-direction: column; align-items: center;
}
.flow-step .step-num {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--bg-card); border: 2px solid var(--accent-blue);
  color: var(--accent-blue); font-size: 13px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  z-index: 2; position: relative;
  box-shadow: 0 0 0 4px var(--bg-primary), 0 0 10px rgba(88,166,255,0.18);
}
.flow-step:not(:last-child) .step-line {
  width: 2px; flex: 1; min-height: 20px;
  background: var(--border-light); margin-top: 4px;
}
.flow-step .step-content { flex: 1; padding-bottom: 28px; }

/* Step card */
.step-card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); padding: 18px 22px;
  box-shadow: var(--shadow-sm); transition: var(--transition);
}
.step-card:hover {
  border-color: var(--border-light);
  box-shadow: var(--shadow-md);
}
.step-card-header {
  margin-bottom: 14px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border-color);
}
.step-card-header h3 {
  font-size: 17px; font-weight: 800; margin-bottom: 4px; color: var(--text-primary);
}
.step-card-header .step-subtitle {
  font-size: 12.5px; color: var(--accent-blue); font-weight: 500; line-height: 1.5;
}
.step-body {
  display: flex; flex-direction: column; gap: 10px;
  font-size: 14px; color: var(--text-secondary); line-height: 1.75;
}

/* Compact sub-step card */
.step-card-compact {
  padding: 14px 18px;
  border-radius: 10px;
}
.step-card-compact .step-card-header {
  margin-bottom: 10px; padding-bottom: 8px;
}
.step-card-compact .step-card-header h3 {
  font-size: 15.5px;
}
.step-card-compact .step-card-header .step-subtitle {
  font-size: 12px;
}
.step-card-compact .step-body {
  gap: 8px;
  font-size: 13.5px; line-height: 1.7;
}

/* Sub-section labels inside a flow step */
.step-body .info-block,
.step-body .quote-block,
.step-body .script-block {
  margin: 0; border-radius: 8px; padding: 10px 14px;
}
.step-body .info-label,
.step-body .quote-label,
.step-body .script-label {
  font-size: 12px; font-weight: 700;
  margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
  text-transform: none; letter-spacing: 0;
}
.step-body .info-label::before,
.step-body .quote-label::before,
.step-body .script-label::before {
  content: ''; width: 4px; height: 14px; border-radius: 2px;
}
.step-body .info-label::before { background: var(--accent-orange); }
.step-body .quote-label::before { background: var(--accent-green); }
.step-body .script-label::before { background: var(--accent-blue); }

.step-body p { margin-bottom: 6px; }
.step-body p:last-child { margin-bottom: 0; }
.step-body ul { padding-left: 20px; margin: 0; }
.step-body ol { padding-left: 20px; margin: 0; }
.step-body li { margin-bottom: 4px; }
.step-body li::marker { color: var(--accent-blue-dim); }
.step-body strong { color: var(--text-primary); font-weight: 600; }

/* Compact multi-column lists inside flow steps */
.step-body ul.two-col {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px 18px;
  padding-left: 18px;
}
.step-body ul.two-col li { margin-bottom: 2px; }

/* Outline block — hierarchical bullet list */
.outline-block { padding: 10px 14px; }
.outline-label {
  font-size: 12px; font-weight: 700; color: var(--accent-blue);
  margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
}
.outline-label::before {
  content: ''; width: 4px; height: 14px; border-radius: 2px;
  background: var(--accent-blue);
}
ul.outline-list {
  padding-left: 0; margin: 0; list-style: none;
  font-size: 13.5px; line-height: 1.7; color: var(--text-secondary);
}
ul.outline-list ul {
  padding-left: 18px; margin-top: 4px; margin-bottom: 4px;
  list-style: none;
  border-left: 1px solid var(--border-light);
}
ul.outline-list li {
  margin-bottom: 4px; padding-left: 14px; position: relative;
}
ul.outline-list li::before {
  content: ''; position: absolute; left: 0; top: 10px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent-blue-dim);
}
ul.outline-list ul li::before {
  background: var(--accent-orange);
}
ul.outline-list ul ul li::before {
  background: var(--accent-green);
}
ul.outline-list ul ul ul li::before {
  background: var(--accent-purple);
}
.outline-text { color: var(--text-secondary); }

/* Nested flow steps */
.flow-children {
  margin-top: 12px; margin-left: 8px; padding-left: 24px;
  border-left: 2px solid var(--border-light);
}
.flow-step-child { gap: 14px; }
.flow-step-child .step-marker { width: 30px; }
.flow-step-child .step-num {
  width: 30px; height: 30px; font-size: 11px; font-weight: 700;
  border-color: var(--accent-blue-dim); color: var(--accent-blue-dim);
  box-shadow: 0 0 0 4px var(--bg-primary);
}
.flow-step-child .step-line {
  background: var(--border-light);
}
.flow-step-child .step-content { padding-bottom: 20px; }

/* Phase container card */
.phase-card {
  border-left: 3px solid var(--accent-blue);
  background: rgba(88,166,255,0.04);
}
.phase-card .step-card-header { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.phase-card .step-card-header h3 { font-size: 17.5px; }

/* Card */
.card-group { margin-bottom: 32px; }
.card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); margin-bottom: 10px; overflow: hidden;
  transition: var(--transition);
  box-shadow: var(--shadow-sm);
}
.card:hover { border-color: var(--border-light); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.card.expanded { border-color: var(--accent-blue); box-shadow: 0 0 0 1px rgba(88,166,255,0.2), var(--shadow-md); }

.card-header {
  display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px;
  cursor: pointer; user-select: none; transition: var(--transition);
}
.card-header:hover { background: rgba(255,255,255,0.03); }
.card-tag {
  flex-shrink: 0; width: 7px; height: 7px; border-radius: 50%; margin-top: 9px;
  box-shadow: 0 0 6px currentColor;
}
.card-title-wrap { flex: 1; min-width: 0; }
.card-title {
  font-size: 15px; font-weight: 700; color: var(--text-primary);
  line-height: 1.5;
}
.card-subtitle {
  font-size: 12.5px; color: var(--text-muted); margin-top: 4px;
}
.card-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.card-badge {
  font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 700;
  white-space: nowrap;
}
.card-badge.flow { background: rgba(88,166,255,0.15); color: var(--accent-blue); }
.card-badge.knowledge { background: rgba(188,140,255,0.15); color: var(--accent-purple); }
.card-badge.qa { background: rgba(63,185,80,0.15); color: var(--accent-green); }
.card-badge.scene { background: rgba(210,153,34,0.15); color: var(--accent-orange); }
.card-badge.policy { background: rgba(57,208,216,0.15); color: var(--accent-teal); }
.card-expand-icon {
  color: var(--text-muted); font-size: 14px; transition: var(--transition); flex-shrink: 0; margin-top: 4px;
}
.card.expanded .card-expand-icon { transform: rotate(90deg); color: var(--accent-blue); }
.card-fav-btn {
  color: var(--text-muted); font-size: 15px; cursor: pointer; transition: var(--transition);
  background: none; border: none; padding: 2px; margin-top: 2px;
}
.card-fav-btn:hover { color: var(--accent-orange); transform: scale(1.1); }
.card.favorited .card-fav-btn { color: var(--accent-orange); }

.card-body {
  max-height: 0; overflow: hidden; transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
}
.card.expanded .card-body { max-height: 5000px; }
.card-body-inner {
  padding: 0 20px 20px 40px; font-size: 14.5px; line-height: 1.85; color: var(--text-secondary);
}
.card-body-inner h4 { font-size: 15px; font-weight: 700; color: var(--text-primary); margin: 14px 0 8px; }
.card-body-inner h4:first-child { margin-top: 0; }
.card-body-inner p { margin-bottom: 10px; }
.card-body-inner ul, .card-body-inner ol { padding-left: 22px; margin-bottom: 12px; }
.card-body-inner li { margin-bottom: 6px; }
.card-body-inner strong { color: var(--text-primary); font-weight: 600; }
.card-body-inner .quote-block {
  background: rgba(63,185,80,0.08); border-left: 3px solid var(--accent-green);
  padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 12px 0;
  color: var(--text-secondary); font-size: 14px;
}
.card-body-inner .quote-block .quote-label {
  font-size: 11px; font-weight: 800; color: var(--accent-green);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block;
}
.card-body-inner .script-block {
  background: rgba(88,166,255,0.08); border-left: 3px solid var(--accent-blue);
  padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 12px 0;
  color: var(--text-secondary); font-size: 14px;
}
.card-body-inner .script-block .script-label {
  font-size: 11px; font-weight: 800; color: var(--accent-blue);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block;
}
.card-body-inner .info-block {
  background: rgba(210,153,34,0.08); border-left: 3px solid var(--accent-orange);
  border-radius: 0 8px 8px 0; padding: 12px 16px; margin: 12px 0;
}
.card-body-inner .info-block .info-label {
  font-size: 11px; font-weight: 800; color: var(--accent-orange);

.back-to-top {
  position: fixed; bottom: 26px; right: 26px; width: 42px; height: 42px;

.back-to-top.show { opacity: 1; pointer-events: auto; }
.back-to-top:hover { background: var(--accent-blue-dim); color: #fff; border-color: var(--accent-blue); transform: translateY(-2px); }

/* Stats bar */
.stats-bar {

}
.stat-item {
  display: flex; flex-direction: column; gap: 4px;
  padding: 14px 18px; background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius); transition: var(--transition);
}
.stat-item:hover { border-color: var(--border-light); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.stat-item .stat-num { font-size: 24px; font-weight: 800; }

.stat-knowledge .stat-num { color: var(--accent-purple); }
.stat-qa .stat-num { color: var(--accent-green); }
.stat-scene .stat-num { color: var(--accent-orange); }
.stat-policy .stat-num { color: var(--accent-teal); }

.search-results-header {
  margin-bottom: 24px; padding: 20px 24px;

let activeSection = SECTIONS[0].id;
let expandedSectionId = activeSection; // only one section expanded at a time in sidebar tree
let allExpanded = false;
let favOnly = false;
let isSearchMode = false;
let sidebarSearchActive = false;
const favorites = new Set(JSON.parse(localStorage.getItem('ins-favs') || '[]'));

// ============================================================
//  RENDER SECTION TABS
// ============================================================
function renderSidebarTree() {
  const tree = document.getElementById('sidebarTree');
  if (sidebarSearchActive) return; // sidebar search results handle their own rendering
  const groups = ['首通', '二通', '三通'];
  let html = '';
  groups.forEach(group => {
    const groupSections = SECTIONS.filter(s => s.group === group);
    if (groupSections.length === 0) return;
    html += `<div class="tree-group">`;
    html += `<div class="tree-group-header">${group}</div>`;
    groupSections.forEach(sec => {
      const isActive = sec.id === activeSection;
      const isFlow = sec.type === 'flow';
      const isExpanded = !isFlow && expandedSectionId === sec.id;
      const isEmpty = sec.empty || !sec.items || sec.items.length === 0;
      const emptyCls = isEmpty ? 'empty' : '';
      html += `<div class="section-node ${isActive ? 'active' : ''} ${isExpanded ? 'expanded' : ''} ${emptyCls}" data-section="${sec.id}" data-tag-color="${sec.tagColor}">`;
      // Flow sections: clicking title just switches page; no accordion, no children
      html += `<div class="section-header" onclick="${isFlow ? `switchSection('${sec.id}')` : `toggleSectionExpand('${sec.id}')`}">`;
      // No triangle arrow; left accent indicator is shown via CSS border-left
      html += `<span class="section-icon">${sec.icon}</span>`;
      html += `<span class="section-title">${sec.title}</span>`;
      html += `<span class="section-count">${collectAllItems(sec).length}</span>`;
      html += `</div>`;
      // Children: only for non-flow sections
      if (!isFlow) {
        html += `<div class="section-children">`;
        if (isEmpty) {
          html += `<div class="nav-search-empty" style="padding-left:46px">该板块暂无内容</div>`;
        } else {
          html += `<ul class="nav-items">`;
          sec.items.forEach(item => {
            const isFav = favorites.has(item.id) ? 'favorited' : '';
            html += `<li class="nav-item ${isFav}" data-item-id="${item.id}">`;
            html += `<div class="nav-item-row">`;
            html += `<div class="nav-item-header" onclick="scrollToItem('${item.id}')">`;
            html += `<span class="tag-dot ${sec.tagColor}"></span>`;
            html += `<span class="nav-item-title">${item.title}</span>`;
            html += `</div>`;
            html += `<span class="fav-star">&#9733;</span>`;
            html += `</div>`;
            html += `</li>`;
          });
          html += `</ul>`;
        }
        html += `</div>`; // end section-children
      }
      html += `</div>`; // end section-node
    });
    html += `</div>`;
  });
  tree.innerHTML = html;
}

function toggleSectionExpand(sectionId) {
  const sec = SECTIONS.find(s => s.id === sectionId);
  if (!sec) return;
  const isEmpty = sec.empty || !sec.items || sec.items.length === 0;
  if (isEmpty) {
    // Empty sections still switch active state but do not expand
    switchSection(sectionId);
    return;
  }
  // If switching to a different section, make it active and expand
  if (activeSection !== sectionId) {
    activeSection = sectionId;
    expandedSectionId = sectionId;
    // Update header subtitle
    const headerSub = document.getElementById('headerSub');
    if (headerSub) headerSub.textContent = '/ ' + sec.title;
    // Update pages
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${sectionId}`)?.classList.add('active');
    // Clear sidebar search and search mode
    const sbSearch = document.getElementById('sidebarSearch');
    const sbClear = document.getElementById('sidebarSearchClear');
    if (sbSearch) { sbSearch.value = ''; }
    if (sbClear) { sbClear.style.display = 'none'; }
    sidebarSearchActive = false;
    if (isSearchMode) exitSearchMode();
    renderSidebarTree();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  // Same section: toggle expand/collapse (hand accordion: only one open at a time)
  if (expandedSectionId === sectionId) {
    expandedSectionId = null;
  } else {
    expandedSectionId = sectionId;
  }
  renderSidebarTree();
}

function renderMain() {
  const main = document.getElementById('mainContent');
  let html = '';

  // Stats bar — group level
  const totalItems = SECTIONS.reduce((s, sec) => s + collectAllItems(sec).length, 0);
  html += `<div class="stats-bar">`;
  const statGroups = [['首通','flow'], ['二通','qa'], ['三通','scene']];
  statGroups.forEach(([groupName, statCls]) => {
    const groupSections = SECTIONS.filter(s => s.group === groupName);
    const groupTotal = groupSections.reduce((sum, s) => sum + collectAllItems(s).length, 0);
    html += `<div class="stat-item stat-${statCls}">`;
    html += `<span class="stat-num">${groupTotal}</span>`;
    html += `<span class="stat-label">${groupName}</span>`;
    html += `</div>`;
  });
  html += `<div class="stat-item"><span class="stat-num">${totalItems}</span><span class="stat-label">总计</span></div>`;
  html += `</div>`;

  // Section pages
  SECTIONS.forEach(sec => {
    const active = sec.id === activeSection ? 'active' : '';
    html += `<div class="page ${active}" id="page-${sec.id}">`;
    html += renderSectionContent(sec);
    html += `</div>`;
  });

  // Search results page (hidden by default)
  html += `<div class="page" id="page-search"></div>`;

  main.innerHTML = html;
  attachCardListeners();
}

function renderSectionContent(sec) {
  let html = '';
  // Section title
  html += `<div class="section-title-block">`;
  html += `<h2>${sec.icon} ${sec.title} <span class="card-badge ${sec.badgeClass}">${sec.desc}</span></h2>`;
  html += `</div>`;

  // Empty section placeholder
  if (sec.empty || !sec.items || sec.items.length === 0) {
    html += `<div class="empty-section">`;
    html += `<div class="empty-icon">&#128221;</div>`;
    html += `<h3>内容整理中</h3>`;
    html += `<p>该板块的内容正在整理中，敬请期待</p>`;
    html += `<p class="empty-hint">后续整理好内容后可直接在此板块录入</p>`;
    html += `</div>`;
    return html;
  }

  if (sec.type === 'flow') {
    html += `<div class="flow-container">`;
    html += renderFlowSteps(sec.items, sec, [], true);
    html += `</div>`;
  } else {
    html += `<div class="card-group">`;
    sec.items.forEach(item => {
      html += renderCard(item, sec);
    });
    html += `</div>`;
  }
  return html;
}

function renderFlowSteps(items, sec, path, isTop) {
  let html = '';
  items.forEach((item, idx) => {
    const numPath = path.concat(idx + 1);
    const numStr = numPath.join('.');
    const hasChildren = item.children && item.children.length > 0;
    const isLast = idx === items.length - 1;
    const level = numPath.length;
    const cls = `flow-step${isTop ? '' : ' flow-step-child'}${hasChildren ? ' flow-step-parent' : ''}`;
    html += `<div class="${cls}" id="${item.id}" data-item-id="${item.id}" data-section="${sec.id}" data-level="${level}">`;
    html += `<div class="step-marker">`;
    html += `<div class="step-num">${numStr}</div>`;
    if (!isLast) html += `<div class="step-line"></div>`;
    html += `</div>`;
    html += `<div class="step-content">`;
    html += `<div class="step-card${hasChildren ? ' phase-card' : ''}${level > 1 ? ' step-card-compact' : ''}">`;
    html += `<div class="step-card-header">`;
    html += `<h3>${item.title}</h3>`;
    if (item.subtitle) html += `<div class="step-subtitle">${item.subtitle}</div>`;
    html += `</div>`;
    if (item.content && item.content.length) {
      html += `<div class="step-body">`;
      item.content.forEach(block => { html += renderBlock(block, sec); });
      html += `</div>`;
    }
    html += `</div>`; // .step-card
    if (hasChildren) {
      html += `<div class="flow-children">`;
      html += renderFlowSteps(item.children, sec, numPath, false);
      html += `</div>`;
    }
    html += `</div>`; // .step-content
    html += `</div>`; // .flow-step
  });
  return html;
}

// Flatten all items (including nested children) within a section
function collectAllItems(sec) {
  const out = [];
  (function walk(list) {
    (list || []).forEach(it => {
      out.push(it);
      if (it.children) walk(it.children);
    });
  })(sec.items);
  return out;
}

function renderCard(item, sec) {
  const isFav = favorites.has(item.id) ? 'favorited' : '';
  let html = `<div class="card ${isFav}" id="${item.id}" data-item-id="${item.id}" data-section="${sec.id}">`;
  html += `<div class="card-header">`;
  html += `<span class="card-tag ${sec.tagColor}"></span>`;
  html += `<div class="card-title-wrap">`;
  html += `<div class="card-title">${item.title}</div>`;
  if (item.subtitle) html += `<div class="card-subtitle">${item.subtitle}</div>`;
  html += `</div>`;
  html += `<div class="card-actions">`;
  html += `<button class="card-fav-btn" data-fav-id="${item.id}" title="收藏">&#9733;</button>`;
  html += `<span class="card-badge ${sec.badgeClass}">${sec.title}</span>`;
  html += `<span class="card-expand-icon">&#9654;</span>`;
  html += `</div></div>`;
  html += `<div class="card-body"><div class="card-body-inner">`;
  (item.content || []).forEach(block => {
    html += renderBlock(block, sec);
  });
  html += `</div></div></div>`;
  return html;
}

function renderBlock(block, sec) {
  let html = '';
  if (block.type === 'info') {
    html += `<div class="info-block">`;
    if (block.label) html += `<span class="info-label">${block.label}</span>`;
    if (block.text) html += `<p>${block.text}</p>`;
    if (block.items) {
      const colCls = block.items.length > 5 ? ' class="two-col"' : '';
      html += `<ul${colCls}>`;
      block.items.forEach(it => { html += `<li>${it}</li>`; });
      html += `</ul>`;
    }
    html += `</div>`;
  } else if (block.type === 'quote') {
    html += `<div class="quote-block">`;
    if (block.label) html += `<span class="quote-label">${block.label}</span>`;
    html += `<p>${block.text}</p>`;
    html += `</div>`;
  } else if (block.type === 'script') {
    html += `<div class="script-block">`;
    if (block.label) html += `<span class="script-label">${block.label}</span>`;
    html += `<p>${block.text}</p>`;
    html += `</div>`;
  } else if (block.type === 'outline') {
    html += `<div class="outline-block">`;
    if (block.label) html += `<span class="outline-label">${block.label}</span>`;
    html += renderOutlineItems(block.items);
    html += `</div>`;
  }
  return html;
}

function renderOutlineItems(items) {
  if (!items || items.length === 0) return '';
  let html = '<ul class="outline-list">';
  items.forEach(it => {
    html += `<li><span class="outline-text">${it.text}</span>`;
    if (it.items && it.items.length) html += renderOutlineItems(it.items);
    html += `</li>`;
  });
  html += '</ul>';
  return html;
}

// ============================================================
//  SWITCH SECTION (page navigation)
// ============================================================
function switchSection(sectionId) {
  if (isSearchMode) exitSearchMode();
  // Clear sidebar search
  const sbSearch = document.getElementById('sidebarSearch');
  const sbClear = document.getElementById('sidebarSearchClear');
  if (sbSearch) { sbSearch.value = ''; }
  if (sbClear) { sbClear.style.display = 'none'; }
  sidebarSearchActive = false;

  activeSection = sectionId;
  expandedSectionId = sectionId;
  const sec = SECTIONS.find(s => s.id === sectionId);
  // Update header subtitle
  const headerSub = document.getElementById('headerSub');
  if (headerSub && sec) headerSub.textContent = '/ ' + sec.title;
  // Update pages
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${sectionId}`)?.classList.add('active');
  // Re-render sidebar tree
  renderSidebarTree();
  // Close mobile sidebar
  if (window.innerWidth <= 900) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }
  // Reset scroll
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function attachCardListeners() {
  document.querySelectorAll('.card-header').forEach(header => {
    header.addEventListener('click', (e) => {
      if (e.target.closest('.card-fav-btn')) return;
      const card = header.closest('.card');
      card.classList.toggle('expanded');
    });
  });
  document.querySelectorAll('.card-fav-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.dataset.favId;
      toggleFavorite(id, btn);
    });
  });
}

function toggleFavorite(id, btn) {
  const card = btn.closest('.card');
  const navItem = document.querySelector(`.nav-item[data-item-id="${id}"]`);
  if (favorites.has(id)) {
    favorites.delete(id);
    card?.classList.remove('favorited');
    navItem?.classList.remove('favorited');
  } else {
    favorites.add(id);
    card?.classList.add('favorited');
    navItem?.classList.add('favorited');
  }
  localStorage.setItem('ins-favs', JSON.stringify([...favorites]));
  updateFavCount();
  if (favOnly && isSearchMode) applySearchFilters();
}

function updateFavCount() {
  const countEl = document.getElementById('favCount');
  const count = favorites.size;
  countEl.textContent = count;
  countEl.style.display = count > 0 ? 'inline' : 'none';
  const btn = document.getElementById('favFilterBtn');
  if (favOnly) btn.classList.add('active');
  else btn.classList.remove('active');
}

// ============================================================
//  SCROLL TO ITEM (within active section)
// ============================================================
function scrollToItem(id) {
  // Find which section this item belongs to
  let targetSection = null;
  for (const sec of SECTIONS) {
    if (collectAllItems(sec).some(it => it.id === id)) {
      targetSection = sec.id;
      break;
    }
  }
  // Switch section if needed (also expands section and updates tree)
  if (targetSection && targetSection !== activeSection) {
    switchSection(targetSection);
    setTimeout(() => doScrollToItem(id), 350);
  } else {
    doScrollToItem(id);
  }
}

function doScrollToItem(id) {
  const el = document.getElementById(id);
  if (!el) return;
  // Auto expand
  const card = el.closest('.card');
  if (card && !card.classList.contains('expanded')) {
    card.classList.add('expanded');
  }
  // Scroll
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  // Highlight
  setTimeout(() => {
    if (card) {
      card.style.boxShadow = '0 0 0 2px var(--accent-blue)';
      setTimeout(() => { card.style.boxShadow = ''; }, 1500);
    }
  }, 300);
  // Close mobile sidebar
  if (window.innerWidth <= 900) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }
  // Update active nav
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navItem = document.querySelector(`.nav-item[data-item-id="${id}"]`);
  navItem?.classList.add('active');
}

// ============================================================
//  SEARCH (cross-section, unified results page)
// ============================================================
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearSearch');

searchInput.addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  clearBtn.style.display = q ? 'block' : 'none';
  if (q) {
    enterSearchMode();
    performSearch(q, favOnly);
  } else {
    exitSearchMode();
  }
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.style.display = 'none';
  exitSearchMode();
  searchInput.focus();
});

function enterSearchMode() {
  if (isSearchMode) return;
  isSearchMode = true;
  // Hide all section pages
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  // Show search page
  document.getElementById('page-search').classList.add('active');
  // Hide stats bar
  document.querySelector('.stats-bar').style.display = 'none';
}

function exitSearchMode() {
  if (!isSearchMode) return;
  isSearchMode = false;
  // Hide search page
  document.getElementById('page-search').classList.remove('active');
  // Show active section page
  document.getElementById(`page-${activeSection}`)?.classList.add('active');
  // Show stats bar
  document.querySelector('.stats-bar').style.display = '';
  // Clear search page content
  document.getElementById('page-search').innerHTML = '';
}

function performSearch(query, favsOnly) {
  const searchPage = document.getElementById('page-search');
  let html = '';
  let totalMatches = 0;
  let sectionResults = [];

  // Search across all sections (skip empty)
  SECTIONS.forEach(sec => {
    if (sec.empty || !sec.items || sec.items.length === 0) return;
    let matchedItems = [];
    collectAllItems(sec).forEach(item => {
      // Skip non-favorited if favOnly
      if (favsOnly && !favorites.has(item.id)) return;
      // Build searchable text
      let searchText = item.title + ' ' + (item.subtitle || '');
      if (item.content) {
        item.content.forEach(block => {
          if (block.label) searchText += ' ' + block.label;
          if (block.text) searchText += ' ' + block.text;
          if (block.items) searchText += ' ' + block.items.join(' ');
        });
      }
      searchText = searchText.toLowerCase();
      if (searchText.includes(query)) {
        matchedItems.push({ item, score: searchText.split(query).length - 1 });
      }
    });
    if (matchedItems.length > 0) {
      totalMatches += matchedItems.length;
      sectionResults.push({ sec, matchedItems });
    }
  });

  // Header
  html += `<div class="search-results-header">`;
  html += `<h2>&#128269; 搜索结果</h2>`;
  html += `<div class="meta">关键词: "<strong style="color:var(--accent-orange)">${query}</strong>" — 共 ${totalMatches} 条结果${favsOnly ? ' (仅收藏)' : ''}</div>`;
  html += `</div>`;

  if (totalMatches === 0) {
    html += `<div class="no-results"><div class="icon">&#128269;</div>`;
    html += `<p>未找到包含"<strong style="color:var(--accent-orange)">${query}</strong>"的内容${favsOnly ? '（仅搜索已收藏）' : ''}</p></div>`;
    searchPage.innerHTML = html;
    return;
  }

  // Render results grouped by section
  sectionResults.forEach(({ sec, matchedItems }) => {
    html += `<div class="search-section-group">`;
    html += `<div class="search-section-label">${sec.icon} ${sec.title} <span style="color:var(--text-muted)">(${matchedItems.length})</span></div>`;
    matchedItems.forEach(({ item }) => {
      html += renderCard(item, sec);
    });
    html += `</div>`;
  });

  searchPage.innerHTML = html;

  // Auto-expand all cards and highlight
  searchPage.querySelectorAll('.card').forEach(card => {
    card.classList.add('expanded');
    if (query) highlightInElement(card, query);
  });

  // Re-attach card listeners
  searchPage.querySelectorAll('.card-header').forEach(header => {
    header.addEventListener('click', (e) => {
      if (e.target.closest('.card-fav-btn')) return;
      header.closest('.card').classList.toggle('expanded');
    });
  });
  searchPage.querySelectorAll('.card-fav-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFavorite(btn.dataset.favId, btn);
    });
  });
}

function applySearchFilters() {
  const q = searchInput.value.trim().toLowerCase();
  if (q) performSearch(q, favOnly);
}

function highlightInElement(el, query) {
  if (!query) return; // guard against empty-string infinite loop
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
  const texts = [];
  let node;
  while (node = walker.nextNode()) {
    if (node.parentElement && !['SCRIPT','STYLE'].includes(node.parentElement.tagName)) {
      texts.push(node);
    }
  }
  texts.forEach(textNode => {
    const text = textNode.textContent;
    const lower = text.toLowerCase();
    let idx = lower.indexOf(query);
    if (idx >= 0) {
      const frag = document.createDocumentFragment();
      let last = 0;
      while (idx >= 0) {
        if (idx > last) frag.appendChild(document.createTextNode(text.substring(last, idx)));
        const span = document.createElement('span');
        span.className = 'highlight';
        span.textContent = text.substring(idx, idx + query.length);
        frag.appendChild(span);
        last = idx + query.length;
        idx = lower.indexOf(query, last);
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.substring(last)));
      textNode.parentElement.replaceChild(frag, textNode);
    }
  });
}

// ============================================================
//  EXPAND / COLLAPSE ALL (active page only)
// ============================================================
document.getElementById('expandAllBtn').addEventListener('click', () => {
  const activePage = document.querySelector('.page.active');
  if (!activePage) return;
  const cards = activePage.querySelectorAll('.card');
  allExpanded = !allExpanded;
  cards.forEach(c => {
    if (allExpanded) c.classList.add('expanded');
    else c.classList.remove('expanded');
  });
  document.getElementById('expandIcon').textContent = allExpanded ? '\u25B2' : '\u25BC';
  const btn = document.getElementById('expandAllBtn');
  btn.querySelector('.btn-text').textContent = allExpanded ? '全部折叠' : '全部展开';
});

// ============================================================
//  FAV FILTER
// ============================================================
document.getElementById('favFilterBtn').addEventListener('click', () => {
  favOnly = !favOnly;
  updateFavCount();
  const hasTextQuery = searchInput.value.trim() !== '';
  if (favOnly) {
    if (!isSearchMode) enterSearchMode();
    if (hasTextQuery) applySearchFilters();
    else performSearch('', true);
  } else {
    if (isSearchMode) {
      if (hasTextQuery) applySearchFilters();
      else exitSearchMode();
    }
  }
});

// ============================================================
//  BACK TO TOP
// ============================================================
const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
  if (window.scrollY > 400) backToTop.classList.add('show');
  else backToTop.classList.remove('show');
});
backToTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ============================================================
//  MOBILE SIDEBAR
// ============================================================
document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
});
document.getElementById('sidebarOverlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
});

// ============================================================
//  SIDEBAR DIRECTORY SEARCH
// ============================================================
const sidebarSearchInput = document.getElementById('sidebarSearch');
const sidebarSearchClear = document.getElementById('sidebarSearchClear');

sidebarSearchInput.addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  sidebarSearchClear.style.display = q ? 'block' : 'none';
  if (q) {
    sidebarSearchActive = true;
    renderSidebarSearchResults(q);
  } else {
    sidebarSearchActive = false;
    renderSidebarTree();
  }
});

sidebarSearchClear.addEventListener('click', () => {
  sidebarSearchInput.value = '';
  sidebarSearchClear.style.display = 'none';
  sidebarSearchActive = false;
  renderSidebarTree();
  sidebarSearchInput.focus();
});

function renderSidebarSearchResults(query) {
  const tree = document.getElementById('sidebarTree');
  expandedSectionId = null;
  let html = '';
  let totalMatches = 0;

  const groups = ['首通', '二通', '三通'];
  groups.forEach(group => {
    const groupSections = SECTIONS.filter(s => s.group === group);
    let groupMatches = [];

    groupSections.forEach(sec => {
      if (sec.empty || !sec.items || sec.items.length === 0) return;
      collectAllItems(sec).forEach(item => {
        const searchText = (item.title + ' ' + (item.subtitle || '')).toLowerCase();
        if (searchText.includes(query)) {
          groupMatches.push({ item, sec });
          totalMatches++;
        }
      });
    });

    if (groupMatches.length > 0) {
      html += `<div class="nav-search-group-label">${group} (${groupMatches.length})</div>`;
      html += `<ul class="nav-items">`;
      groupMatches.forEach(({ item, sec }) => {
        const isFav = favorites.has(item.id) ? 'favorited' : '';
        html += `<li class="nav-item ${isFav}" data-item-id="${item.id}">`;
        html += `<div class="nav-item-row">`;
        html += `<div class="nav-item-header" onclick="scrollToItem('${item.id}')">`;
        html += `<span class="tag-dot ${sec.tagColor}"></span>`;
        html += `<span class="nav-item-title">${item.title}</span>`;
        html += `</div>`;
        html += `<span class="fav-star">&#9733;</span>`;
        html += `</div>`;
        html += `</li>`;
      });
      html += `</ul>`;
    }
  });

  if (totalMatches === 0) {
    tree.innerHTML = `<div class="nav-search-empty">未找到匹配的目录条目</div>`;
  } else {
    tree.innerHTML = html;
  }
}

// ============================================================
//  INIT
// ============================================================
renderSidebarTree();
renderMain();
updateFavCount();
</script>
